<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>انتخاب محدوده روی نقشه</title>
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { width: 100%; height: 100%; }
  .hint {
    position: absolute; top: 10px; right: 10px; left: 10px; z-index: 1000;
    background: rgba(14, 107, 92, 0.92); color: #fff;
    font-family: sans-serif; font-size: 13px; text-align: center;
    padding: 8px 12px; border-radius: 12px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="hint">نقطه موردنظر را روی نقشه لمس کنید</div>
<script src="leaflet/leaflet.js"></script>
<script>
(function () {
  var q = new URLSearchParams(window.location.search);
  var lat = parseFloat(q.get('lat')) || 35.6892;
  var lng = parseFloat(q.get('lng')) || 51.3890;
  var radius = parseFloat(q.get('radius')) || 500;
  var zoom = parseInt(q.get('zoom') || '15', 10);

  var map = L.map('map').setView([lat, lng], zoom);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  var marker = L.circleMarker([lat, lng], {
    radius: 8, color: '#0E6B5C', weight: 3, fillColor: '#0E6B5C', fillOpacity: 1
  }).addTo(map);
  var circle = L.circle([lat, lng], {
    radius: radius, color: '#0E6B5C', weight: 2, fillColor: '#0E6B5C', fillOpacity: 0.15
  }).addTo(map);

  function selectPoint(p) {
    marker.setLatLng(p);
    circle.setLatLng(p);
    if (window.Android && window.Android.onLocationSelected) {
      window.Android.onLocationSelected(p.lat, p.lng);
    }
  }

  map.on('click', function (e) { selectPoint(e.latlng); });
  // گزارش نقطه اولیه هم تا دکمه تأیید همیشه مقدار داشته باشد
  selectPoint(L.latLng(lat, lng));
})();
</script>
</body>
</html>
